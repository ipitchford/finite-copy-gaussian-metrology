# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: Numerical checks and negative controls (normal mode)
        run: uv run --frozen python -B verification/verify_all.py
        env:
          OPENBLAS_NUM_THREADS: "1"
      - name: Same checks under python -O (no reliance on assert)
        run: uv run --frozen python -O -B verification/verify_all.py
        env:
          OPENBLAS_NUM_THREADS: "1"
      - name: Restore retained results and confirm the tree is otherwise unchanged
        run: git checkout -- verification/results.json && test -z "$(git status --porcelain)"
